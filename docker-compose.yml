services:
  stream-share:
    image: ghcr.io/x3n0n10/stream-share:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # M3U Configuration
      M3U_URL: ""                      # URL or path to M3U file
      M3U_FILE_NAME: "file.m3u"        # Name of the generated M3U file
      M3U_CACHE_EXPIRATION_HOURS: "24"       # Cache expiration in hours

      # Server Configuration
      PORT: 8080                       # Port to listen on
      ADVERTISED_PORT: 443             # Port to advertise in URLs (for reverse proxy)
      HOSTNAME: ""                     # Hostname to use in URLs
      REVERSE_PROXY_ENABLED: "true"            # Whether behind a reverse proxy (for correct URL generation)
      PUBLIC_BASE_URL: ""              # Base URL for public-facing links, e.g. https://my.domain.com/stream-share (overrides REVERSE_PROXY_ENABLED heuristics)
      GIN_MODE: "release"              # Gin mode (debug or release) - read by Gin automatically if set
      HTTPS_ENABLED: "1"                       # Use HTTPS in generated URLs
      CUSTOM_ENDPOINT: ""              # Custom endpoint path
      CUSTOM_ID: ""                    # Custom ID for URL paths
      
      # Xtream Configuration
      XTREAM_USER: ""                  # Xtream API username
      XTREAM_PASSWORD: ""              # Xtream API password
      XTREAM_BASE_URL: ""              # Xtream API base URL
      XTREAM_API_GET_ENABLED: "false"          # Generate get.php from API

      # Legacy authentication (when LDAP is disabled)
      AUTH_USER: ""                         # Username for basic auth
      AUTH_PASSWORD: ""                     # Password for basic auth
      
      # Debug options
      LOG_DEBUG_ENABLED: "true"            # Enable debug logging

      # LDAP Authentication
      LDAP_ENABLED: "true"             # Enable LDAP authentication
      LDAP_SERVER: ""                  # LDAP server URL (ldap://server:389)
      LDAP_BASE_DN: "ou=people,dc=example,dc=com"  # Base DN for user search
      LDAP_BIND_DN: "uid=admin,ou=people,dc=example,dc=com"  # Bind DN for service account
      LDAP_BIND_PASSWORD: ""           # Bind password for service account
      LDAP_USER_ATTRIBUTE: "uid"       # LDAP attribute containing username
      LDAP_GROUP_ATTRIBUTE: "memberOf" # LDAP attribute for group membership
      LDAP_REQUIRED_GROUP: "iptv"      # Group required for authentication
      # Players re-send credentials on every request, including every Range request
      # of a movie, so one playback can mean hundreds of LDAP binds. Successful
      # logins are cached for this long. Only successes are cached, so a wrong
      # password is always re-checked — but a disabled account or changed password
      # keeps working until its entry expires. Set to 0 to re-check every request.
      LDAP_AUTH_CACHE_MINUTES: "5"

      # Database Configuration
      DB_HOST: "db"                    # Postgres hostname 
      DB_PORT: "5432"                  # Postgres port
      DB_NAME: "iptvproxy"             # Postgres database name
      DB_USER: "iptvproxy"             # Postgres username
      DB_PASSWORD: "iptvproxypass"     # Postgres password

      # Discord Bot Configuration
      DISCORD_BOT_TOKEN: ""            # Discord bot token
      DISCORD_ADMIN_ROLE_ID: ""        # Discord role ID for admin commands
      DISCORD_API_URL: ""              # API URL for Discord bot (defaults to hostname)

      # Dashboard Configuration
      INSTANCE_NAME: ""                # Friendly name for this instance, returned by /api/internal/instance (defaults to hostname); useful when a dashboard combines several instances
      STREAM_TECH_PROBE_ENABLED: "false"  # Add audio/video technical info (codec, resolution, bitrate) to active live streams in the dashboard API. Samples bytes already flowing through the existing viewer connection (no extra provider connection); requires ffmpeg (bundled in this image).

      # Provider health check — only relevant when stream-share runs behind a VPN.
      # It periodically probes one live channel so an external watchdog can tell
      # when the provider is blocking our VPN egress IP (many Xtream providers
      # answer with HTTP 456, but that code is non-standard and configurable
      # below). stream-share only REPORTS health here; reconnecting the VPN is
      # intentionally left to a separate service (see the commented "vpn-watchdog"
      # example at the bottom of this file), so this app carries no dependency on
      # any VPN. The verdict is exposed at the authenticated /api/internal/health.
      # This is SEPARATE from the container's Docker HEALTHCHECK, which reports
      # readiness via /healthz (used for `depends_on: condition: service_healthy`)
      # and is unaffected by these settings.
      HEALTHCHECK_ENABLED: "false"          # Enable the provider health probe
      HEALTHCHECK_STREAM_ID: ""             # Live channel id to probe (as in a stream URL, e.g. "12345" or "12345.ts")
      HEALTHCHECK_BLOCKED_CODES: "456"      # Comma-separated upstream status code(s) that mean "IP blocked" (report as "blocked" vs generic "error"); default 456 is just what most providers use
      HEALTHCHECK_TIMES: "04:00,16:00"      # Local (TZ) times to self-probe, comma-separated HH:MM. Empty = only probe at startup and on demand (leave scheduling to the watchdog).
      HEALTHCHECK_TIMEOUT_SECONDS: "15"     # Per-probe timeout
      HEALTHCHECK_MIN_INTERVAL_SECONDS: "60" # Minimum spacing between real probes; caps how often the force-probe endpoint can hit the provider
      HEALTHCHECK_STALE_MINUTES: "0"        # If > 0, /healthz reports unhealthy when the last probe is older than this (catches a stalled probe loop)

      # Multiplexing and Session Management
      SESSION_TIMEOUT_MINUTES: "30"    # User session timeout in minutes
      STREAM_TIMEOUT_MINUTES: "2"      # Stream timeout (after all users disconnect)
      TEMP_LINK_HOURS: "24"            # Temporary download link expiration in hours
      MULTIPLEX_STALL_TIMEOUT_SECONDS: "30"  # Drop a multiplexed viewer whose buffer stalls this long (protects co-viewers)

      # Error slate — when the provider fails before a live stream starts, show the
      # reason on screen instead of dropping the connection, and keep retrying the
      # provider behind the slate. Needs ffmpeg + ttf-dejavu (both in the image);
      # without them this silently falls back to the old drop behaviour.
      ERROR_SLATE_ENABLED: "true"           # Show upstream errors as an on-screen slate
      ERROR_SLATE_RETRY_MAX_MINUTES: "10"   # Keep retrying upstream behind the slate for this long
      # Optional JSON file customising the message per error code. The slate shows the
      # code, its official meaning, and your message. Only "message" is usually needed —
      # the meaning falls back to the standard HTTP text. Applied at startup.
      #   {"403": {"message": "Check your subscription."},
      #    "456": {"meaning": "Connection limit", "message": "All slots in use."}}
      # ERROR_SLATE_MESSAGES_FILE: "/root/error-messages.json"
      # Rendered slate clips are cached on disk (in <root>/slate) and reused. They
      # are pruned when not modified within this many hours; regenerated on demand.
      # 0 uses the default (168 = 7 days); a negative value disables pruning.
      SLATE_CACHE_STALE_HOURS: "168"

      # Caching (single root; subfolders are created internally: <root>/vod and <root>/catchup)
      VOD_CACHE_ENABLED: "true"          # Enable on-demand VOD caching
      CACHE_FOLDER: "/cache"           # Root cache folder — VOD files go in /cache/vod, catchup buffers in /cache/catchup
      # Delete cached VOD files not accessed for this many hours. The sweep also
      # removes files whose entry has expired, orphaned files no longer tracked in
      # the database, and leftover ".part" files from failed downloads. It runs
      # shortly after startup and daily thereafter.
      VOD_CACHE_STALE_HOURS: "24"

      # Local Catchup Buffering
      TZ: "Europe/Amsterdam"           # Timezone — MUST match the timezone of your IPTV clients (TiviMate sends local time)
      CATCHUP_ENABLED: "false"         # Set to "true" to enable local catchup buffering (~18 GB per active channel at 10 Mbps for 4 hours)
      CATCHUP_DURATION_HOURS: "4"            # Hours of catchup to buffer and advertise to clients
      CATCHUP_PAUSE_GRACE_MINUTES: "5" # Minutes to keep recording after the last viewer leaves, so a paused channel can resume via timeshift without a gap (channel switches bypass this)

    volumes:
      - ss_config:/root     # Persistent configuration storage (config, state)
      - ss_cache:/cache     # Cache storage — VOD (/cache/vod) and catchup buffers (/cache/catchup)

    depends_on:
      - db
      
  # PostgreSQL database
  db:
    image: postgres:14-alpine
    container_name: stream-share-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: iptvproxy
      POSTGRES_USER: iptvproxy
      POSTGRES_PASSWORD: iptvproxypass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Uncomment to expose PostgreSQL port for external access
    # ports:
    #  - "5432:5432"
    
  # --- Optional: VPN watchdog -------------------------------------------------
  # Only relevant if you run stream-share behind a VPN. stream-share reports
  # provider health but never reconnects the VPN itself, so it stays independent
  # of any VPN. A separate service closes the loop: it reads the health signal
  # and, when the provider is blocking our egress IP, reconnects the VPN onto a
  # new server and re-checks. A complete, self-contained example (using gluetun,
  # but adaptable to any VPN) lives at examples/vpn-watchdog/ (script + compose
  # snippet). Typical setup: stream-share shares the VPN's network namespace
  #   network_mode: "service:gluetun"
  # so provider traffic egresses through the VPN and the watchdog can reach the
  # VPN's control server on http://localhost:8000.
  # ----------------------------------------------------------------------------

  # Adminer for database management (optional)
  # adminer:
  #   image: adminer
  #   container_name: stream-share-adminer
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     ADMINER_DEFAULT_SERVER: db
  #   depends_on:
  #     - db

volumes:
  ss_config:
  ss_data:
  ss_cache:
  postgres_data:
