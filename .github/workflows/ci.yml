name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    # The test suite runs as its own job, independent of lint: when code lands
    # on master (merge or push), the tests always run and report their own
    # status, even if lint fails on the same commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      # ffmpeg/ffprobe drive the end-to-end tests of progressive VOD serving
      # (real demuxers opening a file while it downloads); they skip without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run test suite
        run: go test -mod vendor -race ./...

      - name: Build
        run: go build -mod vendor

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag stream-share:ci-build
